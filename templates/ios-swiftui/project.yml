# XcodeGen project: run `xcodegen generate` (or ./ios.sh build) after changing this file or adding source files.
name: CounterApp
options:
  bundleIdPrefix: local.modelchat
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CounterApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.modelchat.counterapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CounterApp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  CounterAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CounterApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CounterApp:
    build:
      targets:
        CounterApp: all
        CounterAppTests: [test]
    test:
      targets:
        - CounterAppTests
